# Local development stack — build from source and persist SQLite data.
# Usage: docker compose up --build
# App:   http://localhost:3000  |  Health: http://localhost:3000/health
# Test accounts: see docker/local.env and README "Docker (local)"

services:
  virga:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virga-local
    ports:
      - "${VIRGA_PORT:-3000}:3000"
    env_file:
      - docker/local.env
    environment:
      SECRETS_PATH: /app/docker/local.env
    volumes:
      - virga-db:/app/src/db
      - virga-reports:/app/generated_reports
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  virga-db:
  virga-reports:
